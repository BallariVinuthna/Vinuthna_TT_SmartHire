name: SmartHire Build & CI Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: smart-hire-frontend/package-lock.json

      - name: Build Frontend
        working-directory: smart-hire-frontend
        run: |
          npm ci
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Backend with Maven
        working-directory: smart-hire-backend
        run: |
          mkdir -p src/main/resources/static
          cp -r ../smart-hire-frontend/dist/* src/main/resources/static/
          mvn clean package -DskipTests
