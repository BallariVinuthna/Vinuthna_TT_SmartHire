services:
  - type: web
    name: smarthire
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: ai-rag-documents
      - key: PINECONE_HOST
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        value: jdbc:h2:file:./data/smarthire;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""
