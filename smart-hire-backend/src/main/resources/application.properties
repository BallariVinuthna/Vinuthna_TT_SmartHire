spring.application.name=smart-hire-backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:${DATABASE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/smarthire?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dev@smarthire.com}
spring.mail.password=${MAIL_PASSWORD:devpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring AI / Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
spring.ai.google.genai.embedding.text.dimensions=768

# Pinecone Vector Store Configuration
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:ai-rag-documents}
spring.ai.vectorstore.pinecone.environment=${PINECONE_HOST:}

# Frontend Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Initial Seed Admin Credentials
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@smarthire.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
